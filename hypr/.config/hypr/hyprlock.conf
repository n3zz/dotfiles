general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
}

input-field {
    monitor =
    size = 250, 60
    position = 0, -20
    halign = center
    valign = center
    outer_color = rgba(0, 0, 0, 1)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgba(255, 255, 255, 1)
    fade_on_empty = false
    placeholder_text = <span>Password...</span>
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M:%S")"
    color = rgba(255, 255, 255, 1)
    font_size = 55
    position = 0, 200
    halign = center
    valign = center
}
