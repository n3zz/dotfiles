# hypridle: lock after 5 min, screens off after 10 min, always lock before sleep.
# Idle is paused while anything inhibits it (videos, the Caffeine toggle, full-screen apps).

general {
    # don't start a second lock screen if one is already up
    lock_cmd = pgrep -f '^quickshell -p .*/lock' || quickshell -p $HOME/.config/quickshell/lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
